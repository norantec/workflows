name: Build SpringBoot Projects

on:
  workflow_call:
    inputs:
      production_branch_name:
        type: string
        description: Production branch name
        required: false
        default: master

      development_branch_name:
        type: string
        description: Development branch name
        required: false
        default: beta

      version_file:
        type: string
        description: Path to version declaration file
        required: false
        default: VERSION

      image_name:
        type: string
        required: true

      disable_deploy:
        type: boolean
        required: false
        default: false

      disable_generate_clients:
        type: boolean
        required: false
        default: false

      production_openapi_doc_url:
        type: string
        required: true

      development_openapi_doc_url:
        type: string
        required: true

      build_script:
        type: string
        required: false
        default: ./build.sh

      build_env_keys:
        type: string
        required: false
        default: ''

    secrets:
      docker_password:
        required: true

permissions:
  contents: read
  packages: write
  repository-projects: write
  id-token: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Initialize environment variables
        uses: norantec/workflows/actions/init@main
        with:
          disable_check_version: false

  build:
    needs: init
    runs-on: ubuntu-latest
    outputs:
      RUNTIME_VERSION: ${{ steps.outputs.outputs.RUNTIME_VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com/'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Check project
        run: ls -al

      - name: Initialize environment variables
        uses: norantec/workflows/actions/init@main

      - name: Outputs
        id: outputs
        run: |
          echo RUNTIME_VERSION=${{ env.RUNTIME_VERSION }} >> $GITHUB_OUTPUT

      - name: Create and push docker image
        if: |
          github.ref_name == ${{ inputs.production_branch_name }} ||
          github.ref_name == ${{ inputs.development_branch_name }}     
        uses: norantec/workflows/actions/build@main
        with:
          image_name: ${{ inputs.image_name }}
          registry_namespace: ${{ env.ALIYUN_REGISTRY_NAMESPACE }}
          registry: ${{ env.ALIYUN_REGISTRY_ID }}
          username: ${{ env.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD }}
          runtime: ${{ env.RUNTIME }}
          version: ${{ env.RUNTIME_VERSION }}
          subversion: ${{ github.run_number }}
          build_script: ${{ inputs.build_script }}
          build_env_keys: ${{ inputs.build_env_keys }}

  deploy_and_generate_clients:
    needs: build
    uses: norantec/workflows/.github/workflows/deploy.yml@main
    with:
      version: ${{ needs.build.outputs.RUNTIME_VERSION }}
      production_branch_name: ${{ inputs.production_branch_name }}
      image_name: ${{ inputs.image_name }}
      production_openapi_doc_url: ${{ inputs.production_openapi_doc_url }}
      development_openapi_doc_url: ${{ inputs.development_openapi_doc_url }}
      disable_deploy: ${{ inputs.disable_deploy }}
      disable_generate_clients: ${{ inputs.disable_generate_clients }}
