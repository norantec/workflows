name: Build SpringBoot Projects

on:
  workflow_call:
    inputs:
      production_branch_name:
        type: string
        description: Production branch name
        required: false
        default: master

      development_branch_name:
        type: string
        description: Development branch name
        required: false
        default: beta

      version_file:
        type: string
        description: Path to version declaration file
        required: false
        default: VERSION

      image_name:
        type: string
        required: true

      disable_deploy:
        type: boolean
        required: false
        default: false

      disable_generate_clients:
        type: boolean
        required: false
        default: false

      production_openapi_doc_url:
        type: string
        required: true

      development_openapi_doc_url:
        type: string
        required: true

      java_artifact_id:
        type: string
        required: true

      java_artifact_domain:
        type: string
        required: true

    secrets:
      docker_password:
        required: true

permissions:
  contents: read
  packages: write
  repository-projects: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Initialize environment variables
        uses: norantec/workflows/actions/init@main

      - name: Check version
        uses: norantec/workflows/actions/check-version@main
        if: |
          github.ref_name == ${{ inputs.development_branch_name }}
        with:
          version: ${{ env.VERSION }}
          production_branch_name: ${{ inputs.production_branch_name }}
          development_branch_name: ${{ inputs.development_branch_name }}
          version_file: ${{ inputs.version_file }}

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com/'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Check project
        run: ls -al

      - name: Initialize environment variables
        uses: norantec/workflows/actions/init@main

      - name: Build
        run: |
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
          <servers>
            <server>
            <id>norantec-omni-api</id>
            <username>${env.GITHUB_USERNAME}</username>
            <password>${env.GITHUB_TOKEN}</password>
            </server>
          </servers>
          </settings>
          EOF

          npm i --legacy-peer-deps=true
          npm run build

      - name: Create and push docker image
        if: |
          github.ref_name == ${{ inputs.production_branch_name }} ||
          github.ref_name == ${{ inputs.development_branch_name }}     
        uses: norantec/workflows/actions/init@main
        with:
          image_name: ${{ inputs.image_name }}
          registry_namespace: ${{ env.ALIYUN_REGISTRY_NAMESPACE }}
          registry: ${{ env.ALIYUN_REGISTRY_ID }}
          username: ${{ env.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD }}
          runtime: ${{ env.RUNTIME }}
          version: ${{ env.RUNTIME_VERSION }}
          subversion: ${{ github.run_number }}.${{ github.run_attempt }}

  deploy_and_generate_clients:
    needs: build
    uses: norantec/workflows/.github/workflows/deploy.yml@main
    with:
      production_branch_name: ${{ inputs.production_branch_name }}
      image_name: ${{ inputs.image_name }}
      production_openapi_doc_url: ${{ inputs.production_openapi_doc_url }}
      development_openapi_doc_url: ${{ inputs.development_openapi_doc_url }}
      java_artifact_id: ${{ inputs.java_artifact_id }}
      java_artifact_domain: ${{ inputs.java_artifact_domain }}
      disable_deploy: ${{ inputs.disable_deploy }}
      disable_generate_clients: ${{ inputs.disable_generate_clients }}
