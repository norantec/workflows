name: Build SpringBoot Projects

on:
  workflow_call:
    inputs:
      production_branch_name:
        type: string
        description: Production branch name
        required: false
        default: master

      development_branch_name:
        type: string
        description: Development branch name
        required: false
        default: beta

      version_file:
        type: string
        description: Path to version declaration file
        required: false
        default: VERSION

      image_name:
        type: string
        required: true

      disable_deploy:
        type: boolean
        required: false
        default: false

      disable_generate_clients:
        type: boolean
        required: false
        default: false

      production_openapi_doc_url:
        type: string
        required: true

      development_openapi_doc_url:
        type: string
        required: true

      java_artifact_id:
        type: string
        required: true

      java_artifact_domain:
        type: string
        required: true

    secrets:
      docker_password:
        required: true

permissions:
  contents: read
  packages: write
  repository-projects: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Initialize environment variables
        uses: norantec/workflows/actions/init@main

      - name: Check version
        if: |
          github.ref_name == ${{ inputs.development_branch_name }}
        run: |
          PREVIOUS_DEVELOPMENT_RUNTIME_VERSION=$(git show HEAD~1:${{ inputs.version_file }} 2>/dev/null) || PREVIOUS_DEVELOPMENT_RUNTIME_VERSION=0.0.0
          PRODUCTION_RUNTIME_VERSION=$(git show origin/${{ inputs.production_branch_name }}:${{ inputs.version_file }} 2>/dev/null) || PRODUCTION_RUNTIME_VERSION=0.0.0

          echo "Previous development version: $PREVIOUS_DEVELOPMENT_RUNTIME_VERSION"
          echo "Production version: $PRODUCTION_RUNTIME_VERSION"

          if [[ "$PREVIOUS_DEVELOPMENT_RUNTIME_VERSION" != "$PRODUCTION_RUNTIME_VERSION" && "$PREVIOUS_DEVELOPMENT_RUNTIME_VERSION" != "$RUNTIME_VERSION" ]]; then
            echo "$PREVIOUS_DEVELOPMENT_RUNTIME_VERSION should either be production version or current developing version"
            exit 1
          elif [[ "$PREVIOUS_DEVELOPMENT_RUNTIME_VERSION" = "$PRODUCTION_RUNTIME_VERSION" && "$PREVIOUS_DEVELOPMENT_RUNTIME_VERSION" != "$RUNTIME_VERSION" ]]; then
            LOWER_VERSION=$(printf '%s\n' "$PREVIOUS_DEVELOPMENT_RUNTIME_VERSION" "$RUNTIME_VERSION" | sort -V | head -n 1)
            if [[ "$LOWER_VERSION" = "$RUNTIME_VERSION" ]]; then
              echo "$RUNTIME_VERSION should not be set as the new development version because its lower than current one"
              exit 1
            fi
          elif [[ "$PREVIOUS_DEVELOPMENT_RUNTIME_VERSION" == "$PRODUCTION_RUNTIME_VERSION" && "$PREVIOUS_DEVELOPMENT_RUNTIME_VERSION" == "$RUNTIME_VERSION" ]]; then
            echo "$RUNTIME_VERSION has been sealed for production and need to be bumped"
            exit 1
          fi

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com/'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Check project
        run: ls -al

      - name: Initialize environment variables
        uses: norantec/workflows/actions/init@main

      - name: Build
        run: |
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
          <servers>
            <server>
            <id>norantec-omni-api</id>
            <username>${env.GITHUB_USERNAME}</username>
            <password>${env.GITHUB_TOKEN}</password>
            </server>
          </servers>
          </settings>
          EOF

          npm i --legacy-peer-deps=true
          npm run build

          docker build \
            --file ./Dockerfile \
            -t ${IMAGE_ID}:${IMAGE_TAG} \
            -t ${IMAGE_ID}:${RUNTIME} \
            --build-arg RUNTIME="$RUNTIME" \
            --build-arg RUNTIME_VERSION="$IMAGE_TAG" \
            .

      - name: Login to docker registry
        if: |
          github.ref_name == ${{ inputs.production_branch_name }} ||
          github.ref_name == ${{ inputs.development_branch_name }}     
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY_ID }}
          username: ${{ env.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD }}

      - name: Push images
        if: |
          github.ref_name == ${{ inputs.production_branch_name }} ||
          github.ref_name == ${{ inputs.development_branch_name }}
        run: |
          docker push ${{ env.IMAGE_ID }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_ID }}:${{ env.RUNTIME }}

  deploy_and_generate_clients:
    needs: build
    uses: norantec/workflows/.github/workflows/deploy.yml@main
    with:
      production_branch_name: ${{ inputs.production_branch_name }}
      image_name: ${{ inputs.image_name }}
      production_openapi_doc_url: ${{ inputs.production_openapi_doc_url }}
      development_openapi_doc_url: ${{ inputs.development_openapi_doc_url }}
      java_artifact_id: ${{ inputs.java_artifact_id }}
      java_artifact_domain: ${{ inputs.java_artifact_domain }}
      disable_deploy: ${{ inputs.disable_deploy }}
      disable_generate_clients: ${{ inputs.disable_generate_clients }}
