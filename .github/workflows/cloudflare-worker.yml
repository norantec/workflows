name: Build Cloudflare Worker Projects

on:
  workflow_call:
    inputs:
      production_branch_name:
        type: string
        description: Production branch name
        required: false
        default: master

      development_branch_name:
        type: string
        description: Development branch name
        required: false
        default: beta

      version_file:
        type: string
        description: Path to version declaration file
        required: false
        default: VERSION

      disable_generate_clients:
        type: boolean
        required: false
        default: false

      production_openapi_doc_url:
        type: string
        required: true

      development_openapi_doc_url:
        type: string
        required: true

permissions:
  contents: read
  packages: write
  repository-projects: write
  id-token: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Initialize environment variables
        uses: norantec/workflows/actions/init@main
        with:
          disable_check_version: false
          version_file: ${{ inputs.version_file }}
          production_branch_name: ${{ inputs.production_branch_name }}
          development_branch_name: ${{ inputs.development_branch_name }}

  deploy:
    needs: init
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == inputs.production_branch_name || github.ref_name == inputs.development_branch_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com/'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Check project
        run: ls -al

      - name: Initialize environment variables
        uses: norantec/workflows/actions/init@main
        with:
          version_file: ${{ inputs.version_file }}
          production_branch_name: ${{ inputs.production_branch_name }}
          development_branch_name: ${{ inputs.development_branch_name }}

      - name: Deploy
        run: npx wrangler deploy --minify --define VERSION:${{ env.IMAGE_TAG }}

      - name: Prepare other environment variables
        run: |
          if [[ "${{ env.RUNTIME }}" == "PRODUCTION" ]]; then
            echo OPENAPI_DOC_URL=${{ inputs.production_openapi_doc_url }} >> $GITHUB_ENV
          else
            echo OPENAPI_DOC_URL=${{ inputs.development_openapi_doc_url }} >> $GITHUB_ENV
          fi

      - name: Generate client code and publish
        uses: norantec/workflows/actions/client-codegen@main
        with:
          runtime: ${{ env.RUNTIME }}
          openapi_doc_url: ${{ env.OPENAPI_DOC_URL }}
          current_version: ${{ env.IMAGE_TAG }}
