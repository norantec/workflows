name: Manually Deploy Services and Generate Clients

on:
  workflow_call:
    inputs:
      production_branch_name:
        type: string
        description: Production branch name
        required: false
        default: master

      image_name:
        type: string
        required: true

      production_openapi_doc_url:
        type: string
        required: true

      development_openapi_doc_url:
        type: string
        required: true

      disable_deploy:
        type: boolean
        required: false
        default: false

      disable_generate_clients:
        type: boolean
        required: false
        default: false

      version:
        type: string
        required: false
        default: ''

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      DEPLOY_HOSTS: ${{ steps.setup_hosts.outputs.DEPLOY_HOSTS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Set version environment variable
        run: |
          echo RUNTIME_VERSION=${{ inputs.version }} >> $GITHUB_ENV

      - name: Initialize environment variables
        uses: norantec/workflows/actions/init@main
        with:
          disable_version_action: ${{ inputs.version != '' }}

      - name: Prepare deploy hosts
        id: setup_hosts
        run: |
          ID_TOKEN=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" $ACTIONS_ID_TOKEN_REQUEST_URL&audience=norantec)
          ID_TOKEN=$(echo $ID_TOKEN | jq -r '.value')
          echo DEPLOY_HOSTS=$(curl -L -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer $ID_TOKEN" -H 'Accept: */*' https://workflows-api.norantec.com/$(echo $RUNTIME | tr '[:upper:]' '[:lower:]')/hosts) >> $GITHUB_OUTPUT

  deploy:
    needs: init
    runs-on: ubuntu-latest
    if: ${{ inputs.disable_deploy != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJson(needs.init.outputs.DEPLOY_HOSTS) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Initialize environment variables
        uses: norantec/workflows/actions/init@main

      - name: Setup SSH key and other variables
        run: |
          curl -fSsL ${{ matrix.server.ssh_key }} -H "Authorization: token ${{ env.GITHUB_TOKEN }}" -o ./ssh_id
          curl -fSsL ${{ matrix.server.proxy_ssh_key }} -H "Authorization: token ${{ env.GITHUB_TOKEN }}" -o ./proxy_ssh_id
          echo IMAGE_NAME=${{ inputs.image_name }} >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ matrix.server.host }}
          username: ${{ matrix.server.username }}
          port: ${{ matrix.server.port }}
          key_path: ./ssh_id
          proxy_host: ${{ matrix.server.proxy_host }}
          proxy_username: ${{ matrix.server.proxy_username }}
          proxy_port: ${{ matrix.server.proxy_port }}
          proxy_key_path: ./proxy_ssh_id
          script: |
            set -e
            POSTFIX=$(echo "${{ env.RUNTIME }}" | tr '[:upper:]' '[:lower:]')
            TARGETED_CONTAINER_NAME=${{ env.IMAGE_NAME }}.$POSTFIX
            IMAGE=${{ env.ALIYUN_REGISTRY_ID }}/${{ env.ALIYUN_REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            docker pull $IMAGE
            docker stop $TARGETED_CONTAINER_NAME || true
            docker rm $TARGETED_CONTAINER_NAME || true
            docker run \
              -d \
              --restart always \
              --name $TARGETED_CONTAINER_NAME \
              $IMAGE
            docker system prune -a -f

  generate_publish_client:
    needs: deploy
    if: ${{ inputs.disable_generate_clients != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Initialize environment variables
        uses: norantec/workflows/actions/init@main

      - name: Prepare other environment variables
        run: |
          if [[ "${{ env.RUNTIME }}" == "PRODUCTION" ]]; then
            echo OPENAPI_DOC_URL=${{ inputs.production_openapi_doc_url }} >> $GITHUB_ENV
          else
            echo OPENAPI_DOC_URL=${{ inputs.development_openapi_doc_url }} >> $GITHUB_ENV
          fi

      - name: Generate client code and publish
        uses: norantec/workflows/actions/client-codegen@main
        with:
          runtime: ${{ env.RUNTIME }}
          openapi_doc_url: ${{ env.OPENAPI_DOC_URL }}
          current_version: ${{ env.RUNTIME_VERSION }}
