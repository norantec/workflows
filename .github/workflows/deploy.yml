name: Manually Deploy Services and Generate Clients

on:
  workflow_call:
    inputs:
      production_branch_name:
        type: string
        description: Production branch name
        required: false
        default: master

      image_name:
        type: string
        required: true

      production_openapi_doc_url:
        type: string
        required: true

      development_openapi_doc_url:
        type: string
        required: true

      java_artifact_id:
        type: string
        required: true

      java_artifact_domain:
        type: string
        required: true

      disable_deploy:
        type: boolean
        required: false
        default: false

      disable_generate_clients:
        type: boolean
        required: false
        default: false

      version:
        type: string
        required: false
        default: ''

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      DEPLOY_HOSTS: ${{ steps.setup_hosts.outputs.DEPLOY_HOSTS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Set version environment variable
        run: |
          echo RUNTIME_VERSION=${{ inputs.version }} >> $GITHUB_ENV

      - name: Initialize environment variables
        uses: norantec/workflows/actions/init@main
        with:
          disable_version_action: ${{ inputs.version != '' }}

      - name: Prepare deploy hosts
        id: setup_hosts
        run: |
          ID_TOKEN=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" $ACTIONS_ID_TOKEN_REQUEST_URL&audience=norantec)
          ID_TOKEN=$(echo $ID_TOKEN | jq -r '.value')
          echo DEPLOY_HOSTS=$(curl -L -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer $ID_TOKEN" -H 'Accept: */*' https://workflows-api.norantec.com/$(echo $RUNTIME | tr '[:upper:]' '[:lower:]')/hosts) >> $GITHUB_OUTPUT

  deploy:
    needs: init
    runs-on: ubuntu-latest
    if: ${{ inputs.disable_deploy != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJson(needs.init.outputs.DEPLOY_HOSTS) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Initialize environment variables
        uses: norantec/workflows/actions/init@main

      - name: Setup SSH key and other variables
        run: |
          curl -fSsL ${{ matrix.server.ssh_key }} -H "Authorization: token ${{ env.GITHUB_TOKEN }}" -o ./ssh_id
          curl -fSsL ${{ matrix.server.proxy_ssh_key }} -H "Authorization: token ${{ env.GITHUB_TOKEN }}" -o ./proxy_ssh_id
          echo IMAGE_NAME=${{ inputs.image_name }} >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ matrix.server.host }}
          username: ${{ matrix.server.username }}
          port: ${{ matrix.server.port }}
          key_path: ./ssh_id
          proxy_host: ${{ matrix.server.proxy_host }}
          proxy_username: ${{ matrix.server.proxy_username }}
          proxy_port: ${{ matrix.server.proxy_port }}
          proxy_key_path: ./proxy_ssh_id
          script: |
            set -e
            POSTFIX=$(echo "${{ env.RUNTIME }}" | tr '[:upper:]' '[:lower:]')
            TARGETED_CONTAINER_NAME=${{ env.IMAGE_NAME }}.$POSTFIX
            IMAGE=${{ env.ALIYUN_REGISTRY_ID }}/${{ env.ALIYUN_REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            docker pull $IMAGE
            docker stop $TARGETED_CONTAINER_NAME || true
            docker rm $TARGETED_CONTAINER_NAME || true
            docker run \
              -d \
              --restart always \
              --name $TARGETED_CONTAINER_NAME \
              -e GITHUB_TOKEN=${{ env.GITHUB_TOKEN }} \
              -e DB_PASSWORD=${{ env.DB_PASSWORD }} \
              -e NORANTEC_WORKER_APPLICATION_ID=5865e0d0-c468-4c78-a1ec-41d39dd36cac \
              -e NORANTEC_WORKER_APPLICATION_SECRET=${{ secrets.NORANTEC_WORKER_APPLICATION_SECRET }} \
              $IMAGE
            docker system prune -a -f

  generate_publish_client:
    needs: deploy
    if: ${{ inputs.disable_generate_clients != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com/'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize environment variables
        uses: norantec/workflows/actions/init@main

      - name: Prepare other environment variables
        run: |
          if [[ "${{ env.RUNTIME }}" == "PRODUCTION" ]]; then
            echo OPENAPI_DOC_URL=${{ inputs.production_openapi_doc_url }} >> $GITHUB_ENV
          else
            echo OPENAPI_DOC_URL=${{ inputs.development_openapi_doc_url }} >> $GITHUB_ENV
          fi

      - name: Generate client code
        id: generate
        run: |
          set -euo pipefail

          ATTEMPT=0

          while true; do
            ATTEMPT=$(( ATTEMPT + 1 ))
            ONLINE_IMAGE_TAG=$(curl -fsSL "${{ env.OPENAPI_DOC_URL }}" | jq -er '.info.version') || ONLINE_IMAGE_TAG=""

            if [[ "$ATTEMPT" -ge 60 ]]; then
              echo "Timedout for fetching online version"
              exit 1
            fi

            if [[ -z "$ONLINE_IMAGE_TAG" ]]; then
              sleep 20
              continue
            fi

            echo "Runtime image tag: $IMAGE_TAG"
            echo "Remote image tag: $ONLINE_IMAGE_TAG"

            if [ "$ONLINE_IMAGE_TAG" = "$IMAGE_TAG" ]; then
              echo "Versions match. Continue."
              break
            fi

            LOWER_IMAGE_TAG=$(printf '%s\n' "$IMAGE_TAG" "$ONLINE_IMAGE_TAG" | sort -V | head -n 1)

            if [ "$LOWER_IMAGE_TAG" = "$IMAGE_TAG" ]; then
              echo "Current version is outdated. Skip remaining jobs."
              echo "HAS_NEXT=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "Waiting for remote version to catch up..."
            sleep 20
          done

          # TypeScript + Axios
          npx @openapitools/openapi-generator-cli generate \
            -i "${{ env.OPENAPI_DOC_URL }}" \
            -g typescript-axios \
            -o "./.sdk/typescript/src" \
            --skip-validate-spec \
            --type-mappings Null=null

          # Java
          npx @openapitools/openapi-generator-cli generate \
            -i "${{ env.OPENAPI_DOC_URL }}" \
            -g java \
            --skip-validate-spec \
            -o "./.sdk/java" \
            --type-mappings null=Object \
            --additional-properties="groupId=${{ inputs.java_artifact_domain }},artifactId=${{ inputs.java_artifact_id }},apiPackage=${{ inputs.java_artifact_domain }}.api,modelPackage=${{ inputs.java_artifact_domain }}.model,invokerPackage=${{ inputs.java_artifact_domain }}"

      - name: Publish TypeScript client
        working-directory: .sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
          NPM_TOKEN: ${{ env.NPM_TOKEN }}
        if: |
          ${{ steps.generate.outputs.HAS_NEXT != 'false' }}
        run: |
          npm install --legacy-peer-deps=true
          npm run build

          if [[ "${{ env.RUNTIME }}" != "PRODUCTION" ]]; then
            npm version ${{ env.RUNTIME_VERSION }}-beta.${{ github.run_number }}.${{ github.run_attempt }}
          else
            npm version ${{ env.RUNTIME_VERSION }}
          fi

          npm publish --tag latest

      - name: Publish Java client
        working-directory: .sdk/java
        if: |
          ${{ steps.generate.outputs.HAS_NEXT != 'false' }}
        run: |
          mkdir -p ~/.m2 || true

          cat > ~/.m2/settings.xml << EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.repository_owner }}</username>
                <password>${{ env.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

          mvn org.codehaus.mojo:versions-maven-plugin:set -DnewVersion="${{ env.RUNTIME_VERSION }}${{ env.RUNTIME != 'PRODUCTION' && '-SNAPSHOT' || '' }}" -DgenerateBackupPoms=false
          mvn deploy \
            -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }} \
            -DrepositoryId=github
