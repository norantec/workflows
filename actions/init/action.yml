name: Initialize environment variables

inputs:
  production_branch_name:
    type: string
    description: Production branch name
    required: true
    default: master

  development_branch_name:
    type: string
    description: Development branch name
    required: false
    default: beta

  version_file:
    type: string
    description: Path to version declaration file
    required: false
    default: VERSION

  disable_check_version:
    type: boolean
    required: false
    default: true

  disable_version_action:
    type: boolean
    required: false
    default: false

runs:
  using: composite
  steps:
    - name: Check version
      uses: norantec/workflows/actions/check-version@main
      if: ${{ inputs.disable_version_action != true }}
      with:
        production_branch_name: ${{ inputs.production_branch_name }}
        development_branch_name: ${{ inputs.development_branch_name }}
        version_file: ${{ inputs.version_file }}
        disable_check_version: ${{ inputs.disable_check_version }}

    - name: Get and set variables
      shell: bash
      run: |
        if [ "${{ github.ref_name }}" = "${{ inputs.production_branch_name }}" ]; then
          RUNTIME="PRODUCTION"
        else
          RUNTIME="DEVELOPMENT"
        fi

        echo "Runtime: $RUNTIME"

        ID_TOKEN=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" $ACTIONS_ID_TOKEN_REQUEST_URL&audience=norantec)
        ID_TOKEN=$(echo $ID_TOKEN | jq -r '.value')

        while IFS='=' read -r key value; do
          [[ -z "$key" || "$key" == \#* ]] && continue
          export "$key=$value"
          echo $key=$value >> $GITHUB_ENV
        done < <(curl -L -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer $ID_TOKEN" -H 'Accept: */*' https://workflows-api.norantec.com/$(echo $RUNTIME | tr '[:upper:]' '[:lower:]')/env)

        IMAGE_TAG=$RUNTIME_VERSION-$RUNTIME.${{ github.run_number }}.${{ github.run_attempt }}

        echo RUNTIME=$RUNTIME >> $GITHUB_ENV
        echo DB_PASSWORD=$DB_PASSWORD >> $GITHUB_ENV
        echo IMAGE_TAG=$IMAGE_TAG >> $GITHUB_ENV
