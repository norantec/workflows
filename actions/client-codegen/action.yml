name: Generate client code with OpenAPI document

inputs:
  openapi_doc_url:
    type: string
    required: true

  current_version:
    type: string
    required: true

  runtime:
    type: string
    required: true

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '24'
        registry-url: 'https://npm.pkg.github.com/'

    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    - name: Generate client code
      shell: bash
      id: generate
      env:
        CURRENT_VERSION: ${{ inputs.current_version }}
        OPENAPI_DOC_URL: ${{ inputs.openapi_doc_url }}
      run: |
        set -euo pipefail

        ATTEMPT=0

        while true; do
          ATTEMPT=$(( ATTEMPT + 1 ))
          ONLINE_VERSION=$(curl -fsSL "${{ env.OPENAPI_DOC_URL }}" | jq -er '.info.version') || ONLINE_VERSION=""

          if [[ "$ATTEMPT" -ge 60 ]]; then
            echo "Timedout for fetching online version"
            exit 1
          fi

          if [[ -z "$ONLINE_VERSION" ]]; then
            sleep 20
            continue
          fi

          echo "Runtime image tag: $IMAGE_TAG"
          echo "Remote image tag: $ONLINE_VERSION"

          if [ "$ONLINE_VERSION" = "$IMAGE_TAG" ]; then
            echo "Versions match. Continue."
            break
          fi

          LOWER_IMAGE_TAG=$(printf '%s\n' "$IMAGE_TAG" "$ONLINE_VERSION" | sort -V | head -n 1)

          if [ "$LOWER_IMAGE_TAG" = "$IMAGE_TAG" ]; then
            echo "Current version is outdated. Skip remaining jobs."
            echo "HAS_NEXT=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Waiting for remote version to catch up..."
          sleep 20
        done

        # TypeScript + Axios
        npx @openapitools/openapi-generator-cli generate \
          -i "${{ env.OPENAPI_DOC_URL }}" \
          -g typescript-axios \
          -o "./.sdk/typescript/src" \
          --skip-validate-spec \
          --type-mappings Null=null

        # Java
        npx @openapitools/openapi-generator-cli generate \
          -i "${{ env.OPENAPI_DOC_URL }}" \
          -g java \
          --skip-validate-spec \
          --skip-overwrite \
          -o "./.sdk/java" \
          --type-mappings null=Object

    - name: Publish TypeScript client
      working-directory: .sdk/typescript
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        NPM_TOKEN: ${{ env.NPM_TOKEN }}
        RUNTIME: ${{ inputs.runtime }}
        RUNTIME_VERSION: ${{ inputs.current_version }}
      if: |
        ${{ steps.generate.outputs.HAS_NEXT != 'false' }}
      run: |
        npm install --legacy-peer-deps=true
        npm run build

        if [[ "${{ env.RUNTIME }}" != "PRODUCTION" ]]; then
          npm version ${{ env.RUNTIME_VERSION }}-beta.${{ github.run_number }}.${{ github.run_attempt }}
        else
          npm version ${{ env.RUNTIME_VERSION }}
        fi

        npm publish --tag latest

    - name: Publish Java client
      working-directory: .sdk/java
      shell: bash
      env:
        RUNTIME: ${{ inputs.runtime }}
        RUNTIME_VERSION: ${{ inputs.current_version }}
      if: |
        ${{ steps.generate.outputs.HAS_NEXT != 'false' }}
      run: |
        mkdir -p ~/.m2 || true

        cat > ~/.m2/settings.xml << EOF
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
          xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
          xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                              https://maven.apache.org/xsd/settings-1.0.0.xsd">
          <servers>
            <server>
              <id>github</id>
              <username>${{ github.repository_owner }}</username>
              <password>${{ env.GITHUB_TOKEN }}</password>
            </server>
          </servers>
        </settings>
        EOF

        mvn org.codehaus.mojo:versions-maven-plugin:set -DnewVersion="${{ env.RUNTIME_VERSION }}${{ env.RUNTIME != 'PRODUCTION' && '-SNAPSHOT' || '' }}" -DgenerateBackupPoms=false
        mvn deploy \
          -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }} \
          -DrepositoryId=github
