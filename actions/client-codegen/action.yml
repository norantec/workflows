name: Generate client code with OpenAPI document

inputs:
  current_version:
    type: string
    required: true

  runtime:
    type: string
    required: true

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '24'
        registry-url: 'https://npm.pkg.github.com/'

    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install yaml-include
      shell: bash
      run: |
        cargo install yaml-include --version 0.8.1 --locked
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Generate and publish client code
      shell: bash
      id: generate
      env:
        CURRENT_VERSION: ${{ inputs.current_version }}-${{ env.RUNTIME }}.${{ github.run_number }}
      run: |
        sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
        sudo chmod +x /usr/local/bin/yq

        set -euo pipefail

        ATTEMPT=0
        OPENAPI_ENVIRONMENT_TAG=$(echo "${{ inputs.runtime }}" | tr '[:upper:]' '[:lower:]')

        echo "Current OpenAPI environment tag: $OPENAPI_ENVIRONMENT_TAG"

        for config in openapi-generator.*.${OPENAPI_ENVIRONMENT_TAG}.yaml; do
          [ -f "$config" ] || continue

          while true; do
            ATTEMPT=$(( ATTEMPT + 1 ))
            ONLINE_VERSION=$(curl -fsSL $(yaml-include $config | yq '.inputSpec') | jq -er '.info.version') || ONLINE_VERSION=""

            if [[ "$ATTEMPT" -ge 60 ]]; then
              echo "Timedout for fetching online version"
              continue 2
            fi

            if [[ -z "$ONLINE_VERSION" ]]; then
              sleep 20
              continue
            fi

            echo "Runtime image tag: $CURRENT_VERSION"
            echo "Remote image tag: $ONLINE_VERSION"

            if [ "$ONLINE_VERSION" = "$CURRENT_VERSION" ]; then
              echo "Versions match. Continue."
              break
            fi

            LOWER_IMAGE_TAG=$(printf '%s\n' "$CURRENT_VERSION" "$ONLINE_VERSION" | sort -V | head -n 1)

            if [ "$LOWER_IMAGE_TAG" = "$CURRENT_VERSION" ]; then
              echo "Current version is outdated. Skip remaining jobs."
              echo "HAS_NEXT=false" >> $GITHUB_OUTPUT
              continue 2
            fi

            echo "Waiting for remote version to catch up..."
            sleep 20
          done

          CLIENT_TYPE="${config#openapi-generator.}"
          CLIENT_TYPE="${CLIENT_TYPE%.${OPENAPI_ENVIRONMENT_TAG}.yaml}"

          echo "Generating client code for $CLIENT_TYPE..."

          npx @openapitools/openapi-generator-cli generate \
            -c "$config" \
            --skip-overwrite \
            --skip-validate-spec

          if [[ -f ./openapi-generator.$CLIENT_TYPE.sh ]]; then
            RUNTIME=${{ env.RUNTIME }} \
            RUNTIME_VERSION=${{ env.RUNTIME_VERSION }} \
            GITHUB_RUN_NUMBER=${{ github.run_number }} \
            GITHUB_RUN_ATTEMPT=${{ github.run_attempt }} \
            GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }} \
            GITHUB_REPOSITORY=${{ github.repository }} \
            GITHUB_TOKEN=${{ env.GITHUB_TOKEN }} \
            NPM_TOKEN=${{ env.NPM_TOKEN }} \
            bash ./openapi-generator.$CLIENT_TYPE.sh
          else
            (
              cd $(yaml-include $config | yq '.outputDir')

              case "$CLIENT_TYPE" in
                java)
                  mvn org.codehaus.mojo:versions-maven-plugin:set -DnewVersion="${{ env.RUNTIME_VERSION }}${{ env.RUNTIME != 'PRODUCTION' && '-SNAPSHOT' || '' }}" -DgenerateBackupPoms=false
                  mvn deploy \
                    -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }} \
                    -DrepositoryId=github

                  ;;
                typescript-axios)
                  npm install --legacy-peer-deps=true
                  npm run build

                  if [[ "${{ env.RUNTIME }}" != "PRODUCTION" ]]; then
                    npm version ${{ env.RUNTIME_VERSION }}-beta.${{ github.run_number }}.${{ github.run_attempt }} --no-git-tag-version --commit-hooks false
                  else
                    npm version ${{ env.RUNTIME_VERSION }} --no-git-tag-version --commit-hooks false
                  fi

                  npm publish --tag latest

                  ;;
                *)
                  echo "No targeted publisher for $CLIENT_TYPE"
                  ;;
              esac
            )
          fi

        done
