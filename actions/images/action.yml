name: Create and push docker images

inputs:
  image_name:
    type: string
    required: true

  registry_namespace:
    type: string
    required: false
    default: ''

  registry:
    type: string
    required: false
    default: docker.io

  version:
    type: string
    required: true

  runtime:
    type: string
    required: true

  subversion:
    type: string
    required: true

  username:
    type: string
    required: true

  password:
    type: string
    required: true

  disable_push:
    type: boolean
    required: false
    default: false

  dockerfile:
    type: string
    required: false
    default: ./Dockerfile

  build_script:
    type: string
    required: false
    default: ./build.sh

  build_env_keys:
    type: string
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup environment
      shell: bash
      run: |
        if [[ "${{ inputs.runtime }}" != "DEVELOPMENT" && "${{ inputs.runtime }}" != "PRODUCTION" ]]; then
          echo "Invalid runtime value, expected DEVELOPMENT/PRODUCTION, got ${{ inputs.runtime }}"
          exit 1
        fi

        IMAGE_ID=${{ inputs.registry }}

        if [[ "${{ inputs.registry_namespace }}" != "" ]]; then
          IMAGE_ID=$IMAGE_ID/${{ inputs.registry_namespace }}
        fi

        IMAGE_ID=$IMAGE_ID/${{ inputs.image_name }}

        echo IMAGE_ID=$IMAGE_ID >> $GITHUB_ENV
        echo IMAGE_TAG=${{ inputs.version }}-${{ inputs.runtime }}.${{ inputs.subversion }} >> $GITHUB_ENV
        echo RUNTIME=${{ inputs.runtime }} >> $GITHUB_ENV

    - name: Build with dockerfile
      shell: bash
      env:
        BUILD_ENV_KEYS: ${{ inputs.build_env_keys }}
        BUILD_SCRIPT: ${{ inputs.build_script }}
      run: |
        env_args=()

        if [[ "${BUILD_ENV_KEYS}" != "" ]]; then
          IFS=',' read -ra names <<< "${BUILD_ENV_KEYS}"

          for name in "${names[@]}"; do
            name="${name#"${name%%[![:space:]]*}"}"
            name="${name%"${name##*[![:space:]]}"}"

            [[ "$name" =~ ^[a-zA-Z_][a-zA-Z0-9_]*$ ]] || {
              echo "Invalid environment variable name: $name"
              exit 1
            }

            if [[ -v "$name" ]]; then
              env_args+=("$name=${!name}")
            fi
          done
        fi

        env_args+=("FULL_IMAGE_ID=${IMAGE_ID}:${IMAGE_TAG}")
        env_args+=("PATH=${PATH}")
        env_args+=("GITHUB_TOKEN=${{ env.GITHUB_TOKEN }}")

        env -i "${env_args[@]}" /bin/bash $BUILD_SCRIPT

        docker tag ${{ env.IMAGE_ID }}:${{ env.IMAGE_TAG }} ${{ env.IMAGE_ID }}:${{ env.RUNTIME }}

    - name: Login to docker registry
      if: ${{ inputs.disable_push != 'true' }} 
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Push image
      shell: bash
      run: |
        docker push ${{ env.IMAGE_ID }}:${{ env.IMAGE_TAG }}
        docker push ${{ env.IMAGE_ID }}:${{ env.RUNTIME }}
