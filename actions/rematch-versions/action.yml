name: Rematch versions

inputs:
  tag:
    type: string
    required: true

runs:
  using: composite
  steps:
    - name: Rematch
      shell: bash
      run: |
        if [[ "${{ inputs.tag }}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(DEVELOPMENT|PRODUCTION)\.(.+)$ ]]; then
          RUNTIME_VERSION="${BASH_REMATCH[1]}"
          RUNTIME="${BASH_REMATCH[2]}"
          SUBVERSION="${BASH_REMATCH[3]}"
        else
          echo "Invalid tag format: ${{ inputs.tag }}" >&2
          exit 1
        fi

        echo RUNTIME_VERSION=$RUNTIME_VERSION >> $GITHUB_ENV
        echo RUNTIME=$RUNTIME >> $GITHUB_ENV
        echo SUBVERSION=$SUBVERSION >> $GITHUB_ENV
        echo IMAGE_TAG=${{ inputs.tag }} >> $GITHUB_ENV
